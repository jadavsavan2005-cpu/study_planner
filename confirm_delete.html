{% extends "studyplanner/base.html" %}

{% block title %}Confirm delete - Study Planner{% endblock %}

{% block content %}
    <h2>Delete "{{ object }}"?</h2>
    <p>This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a href="{% url 'task_list' %}">Cancel</a>
    </form>
{% endblock %}
